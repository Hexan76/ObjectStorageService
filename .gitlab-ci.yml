
stages:
  - build
  - push
  - deploy

default:
  tags:
    - deploy
  before_script:
    - echo "Running on shell runner"
    - docker --version

variables:
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      variables:
        ENVIRONMENT: "stage"
        IMAGE_TAG: "stage-${CI_PIPELINE_IID}"
    - if: '$CI_COMMIT_BRANCH == "prod"'
      variables:
        ENVIRONMENT: "production"
        IMAGE_TAG: "prod-${CI_PIPELINE_IID}"
    - when: never

.branch_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|prod)$/'

# --------------------------------------------
# BUILD
# --------------------------------------------
build_image:
  stage: build
  extends: .branch_rules
  script:
    - |
      set -euo pipefail

      case "$CI_COMMIT_BRANCH" in
        dev)
          BUILDING_BLOCK_REF="dev"
          PLATFORM="${DOCKER_PLATFORM_STAGE:?Missing DOCKER_PLATFORM_STAGE}"
          ;;
        prod)
          BUILDING_BLOCK_REF="prod"
          PLATFORM="${DOCKER_PLATFORM_PROD:?Missing DOCKER_PLATFORM_PROD}"
          ;;
        *)
          echo "Unsupported branch: $CI_COMMIT_BRANCH" >&2
          exit 1
          ;;
      esac

      : "${BUILDING_BLOCK_USERNAME:?Missing BUILDING_BLOCK_USERNAME}"
      : "${BUILDING_BLOCK_TOKEN:?Missing BUILDING_BLOCK_TOKEN}"

      echo "Preparing Docker build context..."
      rm -rf "$CI_PROJECT_DIR/.docker-context"
      mkdir -p "$CI_PROJECT_DIR/.docker-context/object-storage-service"

      echo "Copying current project..."
      tar --exclude='.git' --exclude='.docker-context' \
        -C "$CI_PROJECT_DIR" -cf - . | \
        tar -C "$CI_PROJECT_DIR/.docker-context/object-storage-service" -xf -

      echo "Cloning building-block ($BUILDING_BLOCK_REF)..."
      git clone --depth 1 \
        --branch "$BUILDING_BLOCK_REF" \
        "https://${BUILDING_BLOCK_USERNAME}:${BUILDING_BLOCK_TOKEN}@gitlab.bsla.dev/microservice/dotnet/building-block.git" \
        "$CI_PROJECT_DIR/.docker-context/building-block"

      export DOCKER_CONFIG="$(mktemp -d)"
      trap 'rm -rf "$DOCKER_CONFIG"' EXIT
      printf '%s' "$CI_REGISTRY_PASSWORD" | \
        docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin

      echo "Building ${CI_REGISTRY_IMAGE}:${IMAGE_TAG} for ${PLATFORM}..."
      docker build \
        --platform "$PLATFORM" \
        --provenance=false \
        -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" \
        -t "$CI_REGISTRY_IMAGE:$ENVIRONMENT" \
        -f "$CI_PROJECT_DIR/.docker-context/object-storage-service/Dockerfile" \
        "$CI_PROJECT_DIR/.docker-context"

# --------------------------------------------
# PUSH
# --------------------------------------------
push_image:
  stage: push
  extends: .branch_rules
  needs:
    - build_image
  script:
    - |
      set -euo pipefail

      export DOCKER_CONFIG="$(mktemp -d)"
      trap 'rm -rf "$DOCKER_CONFIG"' EXIT
      printf '%s' "$CI_REGISTRY_PASSWORD" | \
        docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin

      echo "Pushing versioned image..."
      docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"

      echo "Pushing environment alias..."
      docker push "$CI_REGISTRY_IMAGE:$ENVIRONMENT"

      echo "Pushed: $CI_REGISTRY_IMAGE:$IMAGE_TAG"
      echo "Alias:  $CI_REGISTRY_IMAGE:$ENVIRONMENT"

# --------------------------------------------
# DEPLOY TO COOLIFY
# --------------------------------------------
deploy_coolify:
  stage: deploy
  extends: .branch_rules
  needs:
    - push_image
  script:
    - |
      set -euo pipefail

      case "$CI_COMMIT_BRANCH" in
        dev)
          BASE_URL="${COOLIFY_URL_STAGE:?Missing COOLIFY_URL_STAGE}"
          APP_ID="${COOLIFY_APPLICATION_ID_STAGE:?Missing COOLIFY_APPLICATION_ID_STAGE}"
          DEPLOY_WEBHOOK="${COOLIFY_WEBHOOK_STAGE:?Missing COOLIFY_WEBHOOK_STAGE}"
          API_TOKEN="${COOLIFY_TOKEN_STAGE:?Missing COOLIFY_TOKEN_STAGE}"
          ;;
        prod)
          BASE_URL="${COOLIFY_URL_PROD:?Missing COOLIFY_URL_PROD}"
          APP_ID="${COOLIFY_APPLICATION_ID_PROD:?Missing COOLIFY_APPLICATION_ID_PROD}"
          DEPLOY_WEBHOOK="${COOLIFY_WEBHOOK_PROD:?Missing COOLIFY_WEBHOOK_PROD}"
          API_TOKEN="${COOLIFY_TOKEN_PROD:?Missing COOLIFY_TOKEN_PROD}"
          ;;
        *)
          echo "Unsupported branch: $CI_COMMIT_BRANCH" >&2
          exit 1
          ;;
      esac

      BASE_URL="$(printf '%s' "$BASE_URL" | tr -d '\r\n')"
      BASE_URL="${BASE_URL%/}"
      APP_ID="$(printf '%s' "$APP_ID" | tr -d '\r\n')"
      API_TOKEN="$(printf '%s' "$API_TOKEN" | tr -d '\r\n')"
      DEPLOY_WEBHOOK="$(printf '%s' "$DEPLOY_WEBHOOK" | tr -d '\r\n')"

      echo "Updating Coolify image tag: $IMAGE_TAG"
      curl --fail-with-body --silent --show-error \
        --request PATCH \
        "${BASE_URL}/api/v1/applications/${APP_ID}" \
        --header "Authorization: Bearer ${API_TOKEN}" \
        --header "Content-Type: application/json" \
        --header "Accept: application/json" \
        --data "{\"docker_registry_image_tag\":\"${IMAGE_TAG}\"}"

      echo ""
      echo "Requesting Coolify deployment..."
      curl --fail-with-body --silent --show-error \
        --request GET \
        "$DEPLOY_WEBHOOK" \
        --header "Authorization: Bearer ${API_TOKEN}" \
        --header "Accept: application/json"

      echo ""
      echo "Coolify accepted the deployment request."

      echo "Sending Discord notification..."
      DISCORD_URL="$(printf '%s' "${DISCORD_WEBHOOK:?Missing DISCORD_WEBHOOK}" | tr -d '\r\n')"
      curl --fail-with-body --silent --show-error \
        --request POST \
        --header "Content-Type: application/json" \
        --data "{\"content\":\"✅ Coolify deployment requested\\n\\nEnvironment: ${ENVIRONMENT}\\nProject: ${CI_PROJECT_NAME}\\nBranch: ${CI_COMMIT_BRANCH}\\nTag: ${IMAGE_TAG}\\nCommit: ${CI_COMMIT_SHORT_SHA}\\nPipeline: ${CI_PIPELINE_URL}\"}" \
        "$DISCORD_URL"
